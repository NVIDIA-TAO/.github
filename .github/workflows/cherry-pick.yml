name: Cherry-pick to release (reusable)

# Reusable backport used org-wide. Each repo adds a thin caller:
#
#   name: Cherry-pick to release
#   on:
#     pull_request_target:
#       types: [closed, labeled]     # closed  => backport on merge
#                                    # labeled => backport when a release/* label is added AFTER
#                                    #            merge (the "forgot the label" recovery path)
#     workflow_dispatch:             # manual retrigger for a merged PR, by number
#       inputs:
#         pr_number:
#           description: 'Merged PR number to (re)backport to its release/* labeled branches'
#           required: true
#           type: string
#   jobs:
#     cherry-pick:
#       if: >-
#         github.event_name == 'workflow_dispatch' ||
#         (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
#       uses: NVIDIA-TAO/.github/.github/workflows/cherry-pick.yml@main
#       with:
#         pr_number: ${{ github.event.inputs.pr_number || '' }}
#       secrets: inherit
#
# Cherry-picks a merged PR's merge commit onto every release branch named by a
# `release/X.Y.Z` label on the PR (label == branch). Labels + merge SHA are read
# LIVE from the PR at run time (via `gh pr view`), NOT from the frozen triggering
# event payload — so a release/* label added AFTER merge is honored on the next
# trigger (a `labeled` event, or a manual `workflow_dispatch` by PR number).
# Idempotent: a branch that already contains the cherry-pick (via the `-x` marker)
# is skipped, so repeated label events / re-runs never duplicate or spuriously conflict.
#   - clean    -> blind-push straight to the release branch (bot bypasses the ruleset)
#   - conflict -> push a `cherry-pick/...` branch and open a DRAFT PR, assigned to the author
# A summary comment is posted back on the original PR.
#
# Cherry-picks a MERGED (already-reviewed, on-main) commit — no untrusted PR code runs.
# Runs as tao-cherry-pick-bot via an app token.
#
# Requires secrets (via `secrets: inherit` — set once at org level):
#   TAO_CHERRY_PICK_BOT_APP_ID, TAO_CHERRY_PICK_BOT_PRIVATE_KEY

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number to (re)backport. Empty = use the triggering pull_request event.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  cherry-pick:
    # Run for an explicit PR number (manual dispatch) OR a merged pull_request event
    # (closed on merge, or a label added to an already-merged PR).
    if: >-
      inputs.pr_number != '' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Mint tao-cherry-pick-bot token
        id: token
        uses: actions/create-github-app-token@v2   # TODO: pin to a commit SHA
        with:
          app-id: ${{ secrets.TAO_CHERRY_PICK_BOT_APP_ID }}
          private-key: ${{ secrets.TAO_CHERRY_PICK_BOT_PRIVATE_KEY }}

      - name: Resolve PR metadata (live)
        id: pr
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          INPUT_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PR="${INPUT_PR:-}"
          [ -z "$PR" ] && PR="${EVENT_PR:-}"
          if [ -z "$PR" ]; then echo "::error::no PR number (neither input nor pull_request event)"; exit 1; fi

          # Read the PR LIVE so labels reflect the current state (not the frozen event
          # payload). This is what lets a release/* label added AFTER merge be honored.
          DATA=$(gh pr view "$PR" --repo "$REPO" \
            --json number,merged,mergeCommitSha,title,author,baseRefName,labels)
          MERGED=$(printf '%s' "$DATA" | jq -r '.merged')
          BASE=$(printf '%s' "$DATA" | jq -r '.baseRefName')

          if [ "$MERGED" != "true" ]; then
            echo "PR #$PR is not merged — nothing to backport."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$BASE" != "main" ]; then
            echo "PR #$PR base is '$BASE' (not main) — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          {
            echo "PR=$PR"
            echo "MERGE_SHA=$(printf '%s' "$DATA" | jq -r '.mergeCommitSha')"
            echo "AUTHOR=$(printf '%s' "$DATA" | jq -r '.author.login')"
            echo "LABELS_JSON=$(printf '%s' "$DATA" | jq -c '[.labels[].name]')"
          } >> "$GITHUB_ENV"
          # Title can contain characters awkward for a KEY=VALUE env line; use a heredoc.
          {
            echo "PR_TITLE<<__CP_EOF__"
            printf '%s\n' "$(printf '%s' "$DATA" | jq -r '.title')"
            echo "__CP_EOF__"
          } >> "$GITHUB_ENV"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout (full history)
        if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Cherry-pick to labeled release branches
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          git config user.name  "tao-cherry-pick-bot[bot]"
          git config user.email "tao-cherry-pick-bot[bot]@users.noreply.github.com"

          # Scratch files live OUTSIDE the working tree. In the tree they would
          # (a) collide with a tracked file of the same name at `git checkout`
          # (e.g. a tracked summary.md on a release branch) and (b) get swept into
          # a commit by the conflict path's `git add -A`. Both have happened.
          SCRATCH="$(mktemp -d)"

          # release/* labels -> target branches (label name == branch name)
          BRANCHES=$(printf '%s' "$LABELS_JSON" \
            | python3 -c "import json,sys; print('\n'.join(l for l in json.load(sys.stdin) if l.startswith('release/')))")

          if [ -z "$BRANCHES" ]; then
            echo "No release/* labels on PR #$PR — nothing to backport."
            exit 0
          fi
          echo "Merge commit: $MERGE_SHA"
          echo "Targets:"; printf '  %s\n' $BRANCHES

          : > "$SCRATCH/summary.md"
          for BR in $BRANCHES; do
            echo ""
            echo "=== Backport to $BR ==="
            if ! git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
              echo "  $BR does not exist — skipping"
              echo "- \`$BR\`: :grey_question: branch does not exist — skipped" >> "$SCRATCH/summary.md"
              continue
            fi
            git fetch --quiet origin "$BR"

            # Idempotency: skip if this merge commit is already cherry-picked onto $BR.
            # `git cherry-pick -x` stamps '(cherry picked from commit <sha>)' in the message,
            # so a re-run (another label event, or a manual dispatch) never duplicates the
            # commit or trips a spurious "empty cherry-pick" conflict.
            if git log "origin/$BR" --fixed-strings --grep="cherry picked from commit $MERGE_SHA" -1 --pretty=%H | grep -q .; then
              echo "  already backported to $BR — skipping"
              echo "- \`$BR\`: :ballot_box_with_check: already cherry-picked — skipped" >> "$SCRATCH/summary.md"
              continue
            fi

            git checkout -B "cp-work" "origin/$BR"

            if git cherry-pick -x "$MERGE_SHA"; then
              if git push origin "HEAD:$BR" 2>"$SCRATCH/push.err"; then
                NEW=$(git rev-parse --short HEAD)
                FULL=$(git rev-parse HEAD)
                echo "  clean -> pushed to $BR ($NEW)"
                echo "- \`$BR\`: :white_check_mark: cherry-picked cleanly ([\`$NEW\`]($GITHUB_SERVER_URL/$REPO/commit/$FULL))" >> "$SCRATCH/summary.md"
              else
                echo "  push REJECTED:"; cat "$SCRATCH/push.err"
                echo "- \`$BR\`: :x: cherry-picked cleanly but the push was **rejected** — is \`tao-cherry-pick-bot\` in the bypass list for every release-branch ruleset? (\`$(head -1 "$SCRATCH/push.err" | tr -d '\r')\`)" >> "$SCRATCH/summary.md"
              fi
            else
              echo "  conflict -> draft PR"
              git add -A
              git commit --no-edit
              CPBR="cherry-pick/pr-$PR-to-$(printf '%s' "$BR" | tr '/' '-')"
              git push -f origin "HEAD:$CPBR"
              {
                printf '%s\n' "@$AUTHOR — the automated cherry-pick of #$PR to \`$BR\` **hit conflicts** and needs your attention."
                printf '%s\n' ""
                printf '%s\n' "- Original PR: #$PR (by @$AUTHOR)"
                printf '%s\n' "- Cherry-picked commit: \`$MERGE_SHA\`"
                printf '%s\n' ""
                printf '%s\n' "Please resolve the conflict markers on this branch, then mark the PR ready for review."
              } > "$SCRATCH/prbody.md"
              URL=$(gh pr create --repo "$REPO" --base "$BR" --head "$CPBR" --draft \
                --title "[cherry-pick #$PR -> $BR] $PR_TITLE" --body-file "$SCRATCH/prbody.md" 2>&1 | tail -1)
              gh pr edit "$URL" --repo "$REPO" --add-assignee "$AUTHOR" >/dev/null 2>&1 || true
              echo "- \`$BR\`: :warning: conflicts — draft PR: $URL" >> "$SCRATCH/summary.md"
            fi
            git cherry-pick --abort >/dev/null 2>&1 || true
          done

          {
            echo "<!-- tao-cherry-pick -->"
            echo "### :cherries: Cherry-pick summary"
            echo ""
            cat "$SCRATCH/summary.md"
          } > "$SCRATCH/cpbody.md"
          gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$SCRATCH/cpbody.md" >/dev/null
          echo "posted summary to #$PR"
